[project]
name = "socklock-variants"
version = "0.1.0"
description = "Turn a winning ad script into checked hook / first-line / on-screen text variants"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright>=1.64.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["socklock_variants"]
